<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0e8"><title>GitStock User V6</title><style>html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#f4f0e8;color:#141414}body{display:grid;place-items:center}.card{width:min(440px,calc(100% - 32px));text-align:center}.logo{font-size:25px;font-weight:900;letter-spacing:-.04em}.badge{font-size:10px;background:#141414;color:#fff;padding:6px 9px;border-radius:999px;margin-left:8px}.bar{height:6px;background:rgba(20,20,20,.1);border-radius:99px;overflow:hidden;margin-top:22px}.bar i{display:block;width:55%;height:100%;background:#141414;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(82%)}}p{color:#6d6a63}</style></head><body><main class="card"><div class="logo">GitStock User <span class="badge">V6 LIVE</span></div><p id="status">Loading the secure GitHub app...</p><div class="bar"><i></i></div></main><script>const parts=["live/00.txt","live/01.txt","live/02.txt","live/03.txt","live/04a.txt","live/04b.txt","live/04c.txt","live/05.txt","live/06.txt","live/07a.txt","live/07b.txt","live/07c.txt"];Promise.all(parts.map((url,index)=>fetch(url+"?v=6",{cache:"no-store"}).then(response=>{if(!response.ok)throw new Error("Part "+(index+1)+" failed with "+response.status);return response.text()}))).then(chunks=>{document.open();document.write(chunks.join(""));document.close()}).catch(error=>{document.getElementById("status").textContent="The app did not finish loading. Refresh this page. "+error.message;console.error(error)})</script></body></html>
